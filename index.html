<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js 高级物理沙盒系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        
        #performancePanel {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            border: 1px solid #333;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            z-index: 100;
            max-width: 300px;
        }
        
        #info h3 {
            margin-bottom: 8px;
            color: #4CAF50;
        }
        
        #info p {
            margin: 4px 0;
            font-size: 12px;
        }
        
        .highlight {
            color: #FFD700;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="info">
        <h3>🎮 物理沙盒控制</h3>
        <p><span class="highlight">左键拖拽</span> - 旋转视角</p>
        <p><span class="highlight">右键拖拽</span> - 平移视角</p>
        <p><span class="highlight">滚轮</span> - 缩放</p>
        <p><span class="highlight">Shift+左键</span> - 拾取物体</p>
        <p><span class="highlight">双击物体</span> - 触发爆炸</p>
        <p><span class="highlight">右侧面板</span> - 物体生成器</p>
    </div>
    
    <div id="performancePanel">
        <div>FPS: <span id="fps">0</span></div>
        <div>物体: <span id="objectCount">0</span></div>
        <div>约束: <span id="jointCount">0</span></div>
        <div>物理时间: <span id="physicsTime">0</span>ms</div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/cannon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    
    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        const SandboxSystem = {
            scene: null,
            camera: null,
            physicsEnabled: true,
            timeScale: 1.0,
            objects: [],
            joints: [],
            forceFields: [],
            trails: [],
            particleSystems: [],
            selectedObject: null,
            isDragging: false,
            dragPlane: null,
            debugMode: false,
            showCollisions: false,
            collisionPoints: [],
            objectCounter: 0,
            snapshotData: null,
            lastPhysicsTime: 0,
            
            colors: [
                new BABYLON.Color3(1, 0.3, 0.3),
                new BABYLON.Color3(0.3, 1, 0.3),
                new BABYLON.Color3(0.3, 0.3, 1),
                new BABYLON.Color3(1, 1, 0.3),
                new BABYLON.Color3(1, 0.3, 1),
                new BABYLON.Color3(0.3, 1, 1),
                new BABYLON.Color3(1, 0.6, 0.2),
                new BABYLON.Color3(0.6, 0.2, 0.8),
            ],
            
            init: function() {
                this.createScene();
                this.createLighting();
                this.createGround();
                this.createGUI();
                this.setupInteraction();
                this.setupCollisionDetection();
                this.startRenderLoop();
            },
            
            createScene: function() {
                this.scene = new BABYLON.Scene(engine);
                this.scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.1, 1);
                this.scene.enablePhysics(
                    new BABYLON.Vector3(0, -9.81, 0), 
                    new BABYLON.CannonJSPlugin()
                );
                
                this.camera = new BABYLON.ArcRotateCamera(
                    "camera",
                    -Math.PI / 2,
                    Math.PI / 2.5,
                    25,
                    new BABYLON.Vector3(0, 3, 0),
                    this.scene
                );
                this.camera.attachControl(canvas, true);
                this.camera.lowerBetaLimit = 0.1;
                this.camera.upperBetaLimit = Math.PI / 2 - 0.1;
                this.camera.wheelPrecision = 30;
                this.camera.panningSensibility = 100;
            },
            
            createLighting: function() {
                const hemiLight = new BABYLON.HemisphericLight(
                    "hemiLight",
                    new BABYLON.Vector3(0, 1, 0),
                    this.scene
                );
                hemiLight.intensity = 0.6;
                hemiLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.3);
                
                const dirLight = new BABYLON.DirectionalLight(
                    "dirLight",
                    new BABYLON.Vector3(-1, -2, -1),
                    this.scene
                );
                dirLight.intensity = 0.8;
                dirLight.position = new BABYLON.Vector3(10, 20, 10);
                
                const shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
                shadowGenerator.useBlurExponentialShadowMap = true;
                shadowGenerator.blurKernel = 32;
                this.shadowGenerator = shadowGenerator;
            },
            
            createGround: function() {
                const ground = BABYLON.MeshBuilder.CreateGround(
                    "ground",
                    { width: 40, height: 40 },
                    this.scene
                );
                
                const groundMat = new BABYLON.StandardMaterial("groundMat", this.scene);
                groundMat.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.2);
                groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                ground.material = groundMat;
                ground.receiveShadows = true;
                
                ground.physicsImpostor = new BABYLON.PhysicsImpostor(
                    ground,
                    BABYLON.PhysicsImpostor.BoxImpostor,
                    { mass: 0, restitution: 0.3, friction: 0.8 },
                    this.scene
                );
                
                this.createGridHelper(ground);
            },
            
            createGridHelper: function(ground) {
                const gridSize = 40;
                const gridStep = 2;
                const lines = [];
                
                for (let i = -gridSize/2; i <= gridSize/2; i += gridStep) {
                    lines.push([
                        new BABYLON.Vector3(i, 0.01, -gridSize/2),
                        new BABYLON.Vector3(i, 0.01, gridSize/2)
                    ]);
                    lines.push([
                        new BABYLON.Vector3(-gridSize/2, 0.01, i),
                        new BABYLON.Vector3(gridSize/2, 0.01, i)
                    ]);
                }
                
                const gridMesh = BABYLON.MeshBuilder.CreateLineSystem(
                    "grid",
                    { lines: lines },
                    this.scene
                );
                gridMesh.color = new BABYLON.Color3(0.3, 0.3, 0.4);
            },
            
            createGUI: function() {
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
                
                const mainPanel = new BABYLON.GUI.StackPanel();
                mainPanel.width = "280px";
                mainPanel.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                mainPanel.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
                mainPanel.top = "10px";
                mainPanel.left = "-10px";
                advancedTexture.addControl(mainPanel);
                
                this.createSectionPanel(mainPanel, "📦 物体生成器", (panel) => {
                    this.createObjectGeneratorUI(panel);
                });
                
                this.createSectionPanel(mainPanel, "🔗 物理约束", (panel) => {
                    this.createConstraintsUI(panel);
                });
                
                this.createSectionPanel(mainPanel, "⚡ 力场系统", (panel) => {
                    this.createForceFieldUI(panel);
                });
                
                this.createSectionPanel(mainPanel, "⏱️ 时间控制", (panel) => {
                    this.createTimeControlUI(panel);
                });
                
                this.createSectionPanel(mainPanel, "💾 场景管理", (panel) => {
                    this.createSceneManagementUI(panel);
                });
                
                this.createSectionPanel(mainPanel, "🔧 调试工具", (panel) => {
                    this.createDebugUI(panel);
                });
                
                this.createSectionPanel(mainPanel, "🎯 预设场景", (panel) => {
                    this.createPresetsUI(panel);
                });
            },
            
            createSectionPanel: function(parent, title, contentCallback) {
                const container = new BABYLON.GUI.StackPanel();
                container.width = "100%";
                container.paddingTop = "5px";
                parent.addControl(container);
                
                const header = BABYLON.GUI.Button.CreateSimpleButton("header", title);
                header.width = "100%";
                header.height = "35px";
                header.color = "white";
                header.background = "#2a2a3a";
                header.cornerRadius = 5;
                header.fontSize = 14;
                header.fontWeight = "bold";
                header.horizontalContentAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                header.paddingLeft = "10px";
                container.addControl(header);
                
                const content = new BABYLON.GUI.StackPanel();
                content.width = "100%";
                content.background = "#1a1a2a";
                content.paddingTop = "5px";
                content.paddingBottom = "5px";
                content.isVisible = false;
                container.addControl(content);
                
                header.onPointerClickObservable.add(() => {
                    content.isVisible = !content.isVisible;
                });
                
                contentCallback(content);
            },
            
            createObjectGeneratorUI: function(panel) {
                const shapeTypes = [
                    { name: "球体", type: "sphere" },
                    { name: "立方体", type: "box" },
                    { name: "圆柱体", type: "cylinder" },
                    { name: "锥体", type: "cone" }
                ];
                
                this.addLabel(panel, "几何体类型:");
                this.selectedShapeType = "sphere";
                this.createShapeButtons(panel, shapeTypes);
                
                this.addLabel(panel, "大小 (0.5-3):");
                const sizeSlider = this.addSlider(panel, 1, 0.5, 3);
                this.objectSize = 1;
                sizeSlider.onValueChangedObservable.add((value) => {
                    this.objectSize = value;
                });
                
                this.addLabel(panel, "质量 (0.1-10):");
                const massSlider = this.addSlider(panel, 1, 0.1, 10);
                this.objectMass = 1;
                massSlider.onValueChangedObservable.add((value) => {
                    this.objectMass = value;
                });
                
                this.addLabel(panel, "弹性系数 (0-1):");
                const restitutionSlider = this.addSlider(panel, 0.5, 0, 1);
                this.objectRestitution = 0.5;
                restitutionSlider.onValueChangedObservable.add((value) => {
                    this.objectRestitution = value;
                });
                
                this.addLabel(panel, "摩擦力 (0-1):");
                const frictionSlider = this.addSlider(panel, 0.5, 0, 1);
                this.objectFriction = 0.5;
                frictionSlider.onValueChangedObservable.add((value) => {
                    this.objectFriction = value;
                });
                
                this.addButton(panel, "➕ 添加物体", () => {
                    this.addRandomObject();
                });
                
                this.addButton(panel, "🎲 添加多个物体 (5个)", () => {
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => this.addRandomObject(), i * 100);
                    }
                });
                
                this.addButton(panel, "🗑️ 清除所有物体", () => {
                    this.clearAllObjects();
                });
            },
            
            createConstraintsUI: function(panel) {
                this.addLabel(panel, "选择两个物体创建约束");
                
                this.addButton(panel, "🔗 弹簧约束", () => {
                    this.createConstraintMode = "spring";
                    this.infoText = "点击两个物体创建弹簧约束";
                });
                
                this.addButton(panel, "🚪 铰链约束", () => {
                    this.createConstraintMode = "hinge";
                    this.infoText = "点击两个物体创建铰链约束";
                });
                
                this.addButton(panel, "📏 距离约束", () => {
                    this.createConstraintMode = "distance";
                    this.infoText = "点击两个物体创建距离约束";
                });
                
                this.addButton(panel, "🗑️ 清除所有约束", () => {
                    this.clearAllJoints();
                });
            },
            
            createForceFieldUI: function(panel) {
                this.addLabel(panel, "力场强度:");
                const strengthSlider = this.addSlider(panel, 10, 1, 50);
                this.forceFieldStrength = 10;
                strengthSlider.onValueChangedObservable.add((value) => {
                    this.forceFieldStrength = value;
                });
                
                this.addButton(panel, "🧲 添加吸引力场", () => {
                    this.createForceField("attract");
                });
                
                this.addButton(panel, "💨 添加排斥力场", () => {
                    this.createForceField("repel");
                });
                
                this.addButton(panel, "🗑️ 清除力场", () => {
                    this.clearForceFields();
                });
            },
            
            createTimeControlUI: function(panel) {
                this.addLabel(panel, "时间缩放:");
                const timeSlider = this.addSlider(panel, 1, 0, 3);
                timeSlider.onValueChangedObservable.add((value) => {
                    this.timeScale = value;
                    this.updatePhysicsTimeScale();
                });
                
                this.addButton(panel, "⏸️ 暂停", () => {
                    this.timeScale = 0;
                    timeSlider.value = 0;
                    this.updatePhysicsTimeScale();
                });
                
                this.addButton(panel, "▶️ 正常速度", () => {
                    this.timeScale = 1;
                    timeSlider.value = 1;
                    this.updatePhysicsTimeScale();
                });
                
                this.addButton(panel, "⏩ 快进 (2x)", () => {
                    this.timeScale = 2;
                    timeSlider.value = 2;
                    this.updatePhysicsTimeScale();
                });
                
                this.addButton(panel, "🐌 慢动作 (0.25x)", () => {
                    this.timeScale = 0.25;
                    timeSlider.value = 0.25;
                    this.updatePhysicsTimeScale();
                });
            },
            
            createSceneManagementUI: function(panel) {
                this.addButton(panel, "💾 保存场景快照", () => {
                    this.saveSnapshot();
                });
                
                this.addButton(panel, "📂 加载场景快照", () => {
                    this.loadSnapshot();
                });
                
                this.addButton(panel, "🔄 重置场景", () => {
                    this.resetScene();
                });
            },
            
            createDebugUI: function(panel) {
                this.addCheckbox(panel, "调试模式", (checked) => {
                    this.debugMode = checked;
                    this.updateDebugVisualization();
                });
                
                this.addCheckbox(panel, "显示碰撞点", (checked) => {
                    this.showCollisions = checked;
                });
                
                this.addCheckbox(panel, "显示轨迹", (checked) => {
                    this.showTrails = checked;
                    this.updateTrailVisibility();
                });
                
                this.addCheckbox(panel, "显示速度向量", (checked) => {
                    this.showVelocityVectors = checked;
                    this.updateVelocityVisualization();
                });
            },
            
            createPresetsUI: function(panel) {
                this.addButton(panel, "🎯 多米诺骨牌", () => {
                    this.loadPreset("domino");
                });
                
                this.addButton(panel, "⚛️ 牛顿摆", () => {
                    this.loadPreset("newton");
                });
                
                this.addButton(panel, "📦 堆叠挑战", () => {
                    this.loadPreset("stack");
                });
                
                this.addButton(panel, "🎢 斜坡滚球", () => {
                    this.loadPreset("ramp");
                });
                
                this.addButton(panel, "🎪 杂技塔", () => {
                    this.loadPreset("tower");
                });
            },
            
            addLabel: function(panel, text) {
                const label = new BABYLON.GUI.TextBlock();
                label.text = text;
                label.color = "white";
                label.height = "25px";
                label.fontSize = 12;
                label.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                label.paddingLeft = "10px";
                panel.addControl(label);
            },
            
            addSlider: function(panel, initialValue, min, max) {
                const slider = new BABYLON.GUI.Slider();
                slider.minimum = min;
                slider.maximum = max;
                slider.value = initialValue;
                slider.height = "20px";
                slider.width = "90%";
                slider.color = "#4CAF50";
                slider.background = "#333";
                slider.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
                panel.addControl(slider);
                
                const valueText = new BABYLON.GUI.TextBlock();
                valueText.text = initialValue.toFixed(2);
                valueText.color = "#aaa";
                valueText.height = "20px";
                valueText.fontSize = 11;
                panel.addControl(valueText);
                
                slider.onValueChangedObservable.add((value) => {
                    valueText.text = value.toFixed(2);
                });
                
                return slider;
            },
            
            createShapeButtons: function(panel, shapeTypes) {
                const buttonPanel = new BABYLON.GUI.StackPanel();
                buttonPanel.isVertical = false;
                buttonPanel.height = "35px";
                buttonPanel.width = "90%";
                buttonPanel.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
                panel.addControl(buttonPanel);
                
                const self = this;
                shapeTypes.forEach((shape, index) => {
                    const btn = BABYLON.GUI.Button.CreateSimpleButton("shapeBtn_" + index, shape.name);
                    btn.width = "25%";
                    btn.height = "30px";
                    btn.color = "white";
                    btn.background = index === 0 ? "#4CAF50" : "#3a3a4a";
                    btn.cornerRadius = 3;
                    btn.fontSize = 11;
                    btn.paddingLeft = "2px";
                    btn.paddingRight = "2px";
                    
                    btn.onPointerClickObservable.add(() => {
                        self.selectedShapeType = shape.type;
                        buttonPanel.children.forEach((child, i) => {
                            child.background = i === index ? "#4CAF50" : "#3a3a4a";
                        });
                    });
                    
                    buttonPanel.addControl(btn);
                });
            },
            
            addButton: function(panel, text, callback) {
                const button = BABYLON.GUI.Button.CreateSimpleButton("btn", text);
                button.width = "90%";
                button.height = "32px";
                button.color = "white";
                button.background = "#3a3a4a";
                button.cornerRadius = 3;
                button.fontSize = 12;
                button.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
                button.onPointerClickObservable.add(callback);
                panel.addControl(button);
            },
            
            addCheckbox: function(panel, text, callback) {
                const checkbox = new BABYLON.GUI.Checkbox();
                checkbox.width = "20px";
                checkbox.height = "20px";
                checkbox.isChecked = false;
                checkbox.color = "#4CAF50";
                checkbox.background = "#333";
                
                const label = new BABYLON.GUI.TextBlock();
                label.text = text;
                label.color = "white";
                label.height = "25px";
                label.fontSize = 12;
                
                const stack = new BABYLON.GUI.StackPanel();
                stack.isVertical = false;
                stack.height = "30px";
                stack.width = "90%";
                stack.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
                
                stack.addControl(checkbox);
                stack.addControl(label);
                panel.addControl(stack);
                
                checkbox.onIsCheckedChangedObservable.add(callback);
            },
            
            addRandomObject: function() {
                const type = this.selectedShapeType || "sphere";
                const size = this.objectSize || 1;
                const mass = this.objectMass || 1;
                const restitution = this.objectRestitution || 0.5;
                const friction = this.objectFriction || 0.5;
                
                let mesh;
                const id = this.objectCounter++;
                const color = this.colors[Math.floor(Math.random() * this.colors.length)];
                
                switch(type) {
                    case "sphere":
                        mesh = BABYLON.MeshBuilder.CreateSphere(`obj_${id}`, { diameter: size }, this.scene);
                        break;
                    case "box":
                        mesh = BABYLON.MeshBuilder.CreateBox(`obj_${id}`, { size: size }, this.scene);
                        break;
                    case "cylinder":
                        mesh = BABYLON.MeshBuilder.CreateCylinder(`obj_${id}`, { height: size, diameter: size * 0.6 }, this.scene);
                        break;
                    case "cone":
                        mesh = BABYLON.MeshBuilder.CreateCylinder(`obj_${id}`, { height: size, diameterTop: 0, diameterBottom: size * 0.6 }, this.scene);
                        break;
                }
                
                mesh.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 10,
                    8 + Math.random() * 5,
                    (Math.random() - 0.5) * 10
                );
                
                const material = new BABYLON.StandardMaterial(`mat_${id}`, this.scene);
                material.diffuseColor = color;
                material.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                mesh.material = material;
                
                if (this.shadowGenerator) {
                    this.shadowGenerator.addShadowCaster(mesh);
                }
                mesh.receiveShadows = true;
                
                let impostorType;
                switch(type) {
                    case "sphere":
                        impostorType = BABYLON.PhysicsImpostor.SphereImpostor;
                        break;
                    case "box":
                        impostorType = BABYLON.PhysicsImpostor.BoxImpostor;
                        break;
                    case "cylinder":
                    case "cone":
                        impostorType = BABYLON.PhysicsImpostor.CylinderImpostor;
                        break;
                }
                
                mesh.physicsImpostor = new BABYLON.PhysicsImpostor(
                    mesh,
                    impostorType,
                    { mass: mass, restitution: restitution, friction: friction },
                    this.scene
                );
                
                mesh.metadata = {
                    id: id,
                    type: type,
                    originalSize: size,
                    originalColor: color.clone(),
                    isBreakable: true,
                    breakThreshold: 15
                };
                
                this.objects.push(mesh);
                this.createTrail(mesh);
                this.updateObjectCount();
            },
            
            clearAllObjects: function() {
                this.objects.forEach(obj => {
                    if (obj.trail) obj.trail.dispose();
                    obj.dispose();
                });
                this.objects = [];
                this.clearAllJoints();
                this.updateObjectCount();
            },
            
            clearAllJoints: function() {
                this.joints.forEach(joint => {
                    if (joint.mesh1 && joint.mesh2) {
                        joint.mesh1.physicsImpostor.removeJoint(joint.joint);
                    }
                    if (joint.helper) joint.helper.dispose();
                });
                this.joints = [];
                this.updateJointCount();
            },
            
            setupInteraction: function() {
                this.createConstraintMode = null;
                this.constraintFirstObject = null;
                
                this.scene.onPointerObservable.add((pointerInfo) => {
                    switch (pointerInfo.type) {
                        case BABYLON.PointerEventTypes.POINTERDOWN:
                            this.onPointerDown(pointerInfo);
                            break;
                        case BABYLON.PointerEventTypes.POINTERUP:
                            this.onPointerUp(pointerInfo);
                            break;
                        case BABYLON.PointerEventTypes.POINTERMOVE:
                            this.onPointerMove(pointerInfo);
                            break;
                        case BABYLON.PointerEventTypes.POINTERDOUBLETAP:
                            this.onDoubleTap(pointerInfo);
                            break;
                    }
                });
            },
            
            onPointerDown: function(pointerInfo) {
                if (pointerInfo.pickInfo.hit && pointerInfo.pickInfo.pickedMesh) {
                    const mesh = pointerInfo.pickInfo.pickedMesh;
                    
                    if (this.createConstraintMode && mesh.physicsImpostor) {
                        if (!this.constraintFirstObject) {
                            this.constraintFirstObject = mesh;
                            this.highlightMesh(mesh, true);
                        } else if (mesh !== this.constraintFirstObject) {
                            this.createJoint(this.constraintFirstObject, mesh, this.createConstraintMode);
                            this.highlightMesh(this.constraintFirstObject, false);
                            this.constraintFirstObject = null;
                            this.createConstraintMode = null;
                        }
                        return;
                    }
                    
                    if (pointerInfo.event.shiftKey && mesh.physicsImpostor) {
                        this.selectedObject = mesh;
                        this.isDragging = true;
                        this.camera.detachControl(canvas);
                        
                        if (!this.dragPlane) {
                            this.dragPlane = BABYLON.MeshBuilder.CreatePlane("dragPlane", { size: 100 }, this.scene);
                            this.dragPlane.rotation.x = Math.PI / 2;
                            this.dragPlane.isVisible = false;
                        }
                        this.dragPlane.position.y = mesh.position.y;
                    }
                }
            },
            
            onPointerUp: function(pointerInfo) {
                if (this.isDragging) {
                    this.isDragging = false;
                    this.selectedObject = null;
                    this.camera.attachControl(canvas, true);
                }
            },
            
            onPointerMove: function(pointerInfo) {
                if (this.isDragging && this.selectedObject && this.dragPlane) {
                    const pickResult = this.scene.pick(
                        this.scene.pointerX,
                        this.scene.pointerY,
                        (mesh) => mesh === this.dragPlane
                    );
                    
                    if (pickResult.hit) {
                        const targetPos = pickResult.pickedPoint;
                        const velocity = targetPos.subtract(this.selectedObject.position).scale(20);
                        this.selectedObject.physicsImpostor.setLinearVelocity(velocity);
                    }
                }
            },
            
            onDoubleTap: function(pointerInfo) {
                if (pointerInfo.pickInfo.hit && pointerInfo.pickInfo.pickedMesh) {
                    const mesh = pointerInfo.pickInfo.pickedMesh;
                    if (mesh.physicsImpostor) {
                        this.createExplosion(mesh.position.clone());
                        this.breakObject(mesh);
                    }
                }
            },
            
            highlightMesh: function(mesh, highlight) {
                if (highlight) {
                    mesh.material.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0);
                } else {
                    mesh.material.emissiveColor = new BABYLON.Color3(0, 0, 0);
                }
            },
            
            createJoint: function(mesh1, mesh2, type) {
                let joint;
                const jointData = { mesh1, mesh2, type };
                
                switch(type) {
                    case "spring":
                        joint = new BABYLON.PhysicsJoint(BABYLON.PhysicsJoint.SpringJoint, {
                            pivotA: new BABYLON.Vector3(0, 0, 0),
                            pivotB: new BABYLON.Vector3(0, 0, 0),
                            length: BABYLON.Vector3.Distance(mesh1.position, mesh2.position),
                            stiffness: 50,
                            damping: 5
                        });
                        break;
                        
                    case "hinge":
                        joint = new BABYLON.PhysicsJoint(BABYLON.PhysicsJoint.HingeJoint, {
                            pivotA: new BABYLON.Vector3(0, 0.5, 0),
                            pivotB: new BABYLON.Vector3(0, -0.5, 0),
                            axisA: new BABYLON.Vector3(0, 0, 1),
                            axisB: new BABYLON.Vector3(0, 0, 1)
                        });
                        break;
                        
                    case "distance":
                        joint = new BABYLON.PhysicsJoint(BABYLON.PhysicsJoint.DistanceJoint, {
                            pivotA: new BABYLON.Vector3(0, 0, 0),
                            pivotB: new BABYLON.Vector3(0, 0, 0),
                            maxDistance: BABYLON.Vector3.Distance(mesh1.position, mesh2.position)
                        });
                        break;
                }
                
                mesh1.physicsImpostor.addJoint(mesh2.physicsImpostor, joint);
                jointData.joint = joint;
                
                this.createJointHelper(mesh1, mesh2, type, jointData);
                
                this.joints.push(jointData);
                this.updateJointCount();
            },
            
            createJointHelper: function(mesh1, mesh2, type, jointData) {
                const points = [mesh1.position.clone(), mesh2.position.clone()];
                const line = BABYLON.MeshBuilder.CreateLines("jointLine", { points: points }, this.scene);
                
                switch(type) {
                    case "spring":
                        line.color = new BABYLON.Color3(0, 1, 0);
                        break;
                    case "hinge":
                        line.color = new BABYLON.Color3(1, 0.5, 0);
                        break;
                    case "distance":
                        line.color = new BABYLON.Color3(0, 0.5, 1);
                        break;
                }
                
                jointData.helper = line;
                jointData.updateObserver = this.scene.onBeforeRenderObservable.add(() => {
                    line.update([mesh1.position.clone(), mesh2.position.clone()]);
                });
            },
            
            createForceField: function(type) {
                const field = BABYLON.MeshBuilder.CreateSphere("forceField", { diameter: 2 }, this.scene);
                field.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 10,
                    2,
                    (Math.random() - 0.5) * 10
                );
                
                const mat = new BABYLON.StandardMaterial("fieldMat", this.scene);
                mat.diffuseColor = type === "attract" ? 
                    new BABYLON.Color3(0.5, 0, 1) : 
                    new BABYLON.Color3(1, 0.5, 0);
                mat.emissiveColor = mat.diffuseColor.scale(0.5);
                mat.alpha = 0.5;
                field.material = mat;
                
                field.metadata = {
                    type: type,
                    strength: this.forceFieldStrength || 10
                };
                
                this.forceFields.push(field);
                this.createForceFieldVisual(field, type);
            },
            
            createForceFieldVisual: function(field, type) {
                const particleSystem = new BABYLON.ParticleSystem("fieldParticles", 100, this.scene);
                particleSystem.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBOR0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAGklEQVQYV2NkYGD4z4AHMP7//x+fNKM4QQAAjicF/2p+/UIAAAAASUVORK5CYII=", this.scene);
                
                particleSystem.emitter = field;
                particleSystem.minEmitBox = new BABYLON.Vector3(-0.5, -0.5, -0.5);
                particleSystem.maxEmitBox = new BABYLON.Vector3(0.5, 0.5, 0.5);
                
                particleSystem.color1 = type === "attract" ? 
                    new BABYLON.Color4(0.5, 0, 1, 1) : 
                    new BABYLON.Color4(1, 0.5, 0, 1);
                particleSystem.color2 = particleSystem.color1;
                particleSystem.colorDead = new BABYLON.Color4(0, 0, 0, 0);
                
                particleSystem.minSize = 0.1;
                particleSystem.maxSize = 0.3;
                particleSystem.minLifeTime = 0.5;
                particleSystem.maxLifeTime = 1;
                particleSystem.emitRate = 50;
                
                particleSystem.direction1 = new BABYLON.Vector3(-1, -1, -1);
                particleSystem.direction2 = new BABYLON.Vector3(1, 1, 1);
                
                particleSystem.minEmitPower = 1;
                particleSystem.maxEmitPower = 2;
                
                particleSystem.start();
                field.particleSystem = particleSystem;
            },
            
            clearForceFields: function() {
                this.forceFields.forEach(field => {
                    if (field.particleSystem) field.particleSystem.dispose();
                    field.dispose();
                });
                this.forceFields = [];
            },
            
            applyForceFields: function() {
                this.forceFields.forEach(field => {
                    const strength = field.metadata.strength;
                    const type = field.metadata.type;
                    
                    this.objects.forEach(obj => {
                        if (!obj.physicsImpostor) return;
                        
                        const direction = field.position.subtract(obj.position);
                        const distance = direction.length();
                        
                        if (distance > 0.5 && distance < 15) {
                            direction.normalize();
                            const force = direction.scale(strength / (distance * distance) * 10);
                            
                            if (type === "repel") {
                                force.scaleInPlace(-1);
                            }
                            
                            obj.physicsImpostor.applyForce(force, obj.getAbsolutePosition());
                        }
                    });
                });
            },
            
            createTrail: function(mesh) {
                const trailPoints = [];
                const maxPoints = 50;
                
                for (let i = 0; i < maxPoints; i++) {
                    trailPoints.push(mesh.position.clone());
                }
                
                const trail = BABYLON.MeshBuilder.CreateLines("trail", { points: trailPoints, updatable: true }, this.scene);
                trail.color = mesh.material.diffuseColor.scale(0.5);
                trail.isVisible = this.showTrails || false;
                
                mesh.trail = trail;
                mesh.trailPoints = trailPoints;
                mesh.trailIndex = 0;
                
                mesh.trailObserver = this.scene.onBeforeRenderObservable.add(() => {
                    if (!trail.isVisible) return;
                    
                    mesh.trailPoints[mesh.trailIndex] = mesh.position.clone();
                    mesh.trailIndex = (mesh.trailIndex + 1) % maxPoints;
                    
                    const points = [];
                    for (let i = 0; i < maxPoints; i++) {
                        const idx = (mesh.trailIndex + i) % maxPoints;
                        points.push(mesh.trailPoints[idx]);
                    }
                    
                    BABYLON.MeshBuilder.CreateLines("trail", { points: points, instance: trail });
                });
            },
            
            updateTrailVisibility: function() {
                this.objects.forEach(obj => {
                    if (obj.trail) {
                        obj.trail.isVisible = this.showTrails;
                    }
                });
            },
            
            setupCollisionDetection: function() {
                this.scene.registerBeforeRender(() => {
                    if (!this.physicsEnabled) return;
                    
                    const startTime = performance.now();
                    
                    this.applyForceFields();
                    
                    if (this.showCollisions) {
                        this.updateCollisionVisualization();
                    }
                    
                    if (this.showVelocityVectors) {
                        this.updateVelocityVectors();
                    }
                    
                    this.lastPhysicsTime = performance.now() - startTime;
                });
            },
            
            createExplosion: function(position) {
                const particleSystem = new BABYLON.ParticleSystem("explosion", 500, this.scene);
                particleSystem.particleTexture = new BABYLON.Texture("data:image/png;base64,iVBOR0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAGklEQVQYV2NkYGD4z4AHMP7//x+fNKM4QQAAjicF/2p+/UIAAAAASUVORK5CYII=", this.scene);
                
                particleSystem.emitter = position;
                particleSystem.minEmitBox = new BABYLON.Vector3(0, 0, 0);
                particleSystem.maxEmitBox = new BABYLON.Vector3(0, 0, 0);
                
                particleSystem.color1 = new BABYLON.Color4(1, 0.5, 0, 1);
                particleSystem.color2 = new BABYLON.Color4(1, 0, 0, 1);
                particleSystem.colorDead = new BABYLON.Color4(0.5, 0, 0, 0);
                
                particleSystem.minSize = 0.2;
                particleSystem.maxSize = 0.8;
                particleSystem.minLifeTime = 0.3;
                particleSystem.maxLifeTime = 1.5;
                particleSystem.emitRate = 1000;
                
                particleSystem.direction1 = new BABYLON.Vector3(-1, -1, -1);
                particleSystem.direction2 = new BABYLON.Vector3(1, 1, 1);
                
                particleSystem.minEmitPower = 5;
                particleSystem.maxEmitPower = 15;
                
                particleSystem.targetStopDuration = 0.1;
                particleSystem.disposeOnStop = true;
                
                particleSystem.start();
                
                this.objects.forEach(obj => {
                    if (!obj.physicsImpostor) return;
                    
                    const distance = BABYLON.Vector3.Distance(position, obj.position);
                    if (distance < 8) {
                        const direction = obj.position.subtract(position).normalize();
                        const force = direction.scale(100 / (distance + 0.5));
                        obj.physicsImpostor.applyForce(force, obj.getAbsolutePosition());
                    }
                });
            },
            
            breakObject: function(mesh) {
                if (!mesh.metadata || !mesh.metadata.isBreakable) return;
                
                const position = mesh.position.clone();
                const size = mesh.metadata.originalSize * 0.3;
                const color = mesh.metadata.originalColor;
                
                const index = this.objects.indexOf(mesh);
                if (index > -1) {
                    this.objects.splice(index, 1);
                }
                
                if (mesh.trail) mesh.trail.dispose();
                mesh.dispose();
                
                for (let i = 0; i < 8; i++) {
                    const debris = BABYLON.MeshBuilder.CreateBox(`debris_${i}`, { size: size }, this.scene);
                    debris.position = position.add(new BABYLON.Vector3(
                        (Math.random() - 0.5) * size * 2,
                        (Math.random() - 0.5) * size * 2,
                        (Math.random() - 0.5) * size * 2
                    ));
                    
                    const mat = new BABYLON.StandardMaterial(`debrisMat_${i}`, this.scene);
                    mat.diffuseColor = color;
                    debris.material = mat;
                    
                    debris.physicsImpostor = new BABYLON.PhysicsImpostor(
                        debris,
                        BABYLON.PhysicsImpostor.BoxImpostor,
                        { mass: 0.2, restitution: 0.3, friction: 0.5 },
                        this.scene
                    );
                    
                    const velocity = debris.position.subtract(position).scale(10);
                    debris.physicsImpostor.setLinearVelocity(velocity);
                    
                    this.objects.push(debris);
                    debris.metadata = { isBreakable: false };
                }
                
                this.updateObjectCount();
            },
            
            updatePhysicsTimeScale: function() {
                if (this.scene.getPhysicsEngine()) {
                    this.scene.getPhysicsEngine().setTimeStep(1/60 * this.timeScale);
                }
            },
            
            saveSnapshot: function() {
                this.snapshotData = {
                    objects: this.objects.map(obj => ({
                        type: obj.metadata?.type || "box",
                        position: { x: obj.position.x, y: obj.position.y, z: obj.position.z },
                        rotation: { x: obj.rotation.x, y: obj.rotation.y, z: obj.rotation.z },
                        size: obj.metadata?.originalSize || 1,
                        color: obj.metadata?.originalColor ? {
                            r: obj.metadata.originalColor.r,
                            g: obj.metadata.originalColor.g,
                            b: obj.metadata.originalColor.b
                        } : null,
                        velocity: obj.physicsImpostor ? {
                            x: obj.physicsImpostor.getLinearVelocity().x,
                            y: obj.physicsImpostor.getLinearVelocity().y,
                            z: obj.physicsImpostor.getLinearVelocity().z
                        } : null
                    })),
                    timeScale: this.timeScale
                };
                
                const jsonStr = JSON.stringify(this.snapshotData);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'physics_sandbox_snapshot.json';
                a.click();
                URL.revokeObjectURL(url);
            },
            
            loadSnapshot: function() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            this.snapshotData = JSON.parse(event.target.result);
                            this.restoreSnapshot();
                        } catch (err) {
                            console.error('Failed to load snapshot:', err);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            },
            
            restoreSnapshot: function() {
                if (!this.snapshotData) return;
                
                this.clearAllObjects();
                
                this.snapshotData.objects.forEach((objData, i) => {
                    setTimeout(() => {
                        this.selectedShapeType = objData.type;
                        this.objectSize = objData.size;
                        
                        this.addRandomObject();
                        
                        const obj = this.objects[this.objects.length - 1];
                        obj.position = new BABYLON.Vector3(objData.position.x, objData.position.y, objData.position.z);
                        obj.rotation = new BABYLON.Vector3(objData.rotation.x, objData.rotation.y, objData.rotation.z);
                        
                        if (objData.velocity && obj.physicsImpostor) {
                            obj.physicsImpostor.setLinearVelocity(new BABYLON.Vector3(
                                objData.velocity.x,
                                objData.velocity.y,
                                objData.velocity.z
                            ));
                        }
                    }, i * 50);
                });
                
                this.timeScale = this.snapshotData.timeScale || 1;
            },
            
            resetScene: function() {
                this.clearAllObjects();
                this.clearForceFields();
                this.timeScale = 1;
                this.updatePhysicsTimeScale();
            },
            
            loadPreset: function(presetName) {
                this.clearAllObjects();
                this.clearForceFields();
                
                switch(presetName) {
                    case "domino":
                        this.createDominoPreset();
                        break;
                    case "newton":
                        this.createNewtonPreset();
                        break;
                    case "stack":
                        this.createStackPreset();
                        break;
                    case "ramp":
                        this.createRampPreset();
                        break;
                    case "tower":
                        this.createTowerPreset();
                        break;
                }
            },
            
            createDominoPreset: function() {
                const count = 15;
                for (let i = 0; i < count; i++) {
                    const domino = BABYLON.MeshBuilder.CreateBox(`domino_${i}`, { width: 0.2, height: 1.5, depth: 0.8 }, this.scene);
                    domino.position = new BABYLON.Vector3(i * 0.6 - 4, 0.75, 0);
                    
                    const mat = new BABYLON.StandardMaterial(`dominoMat_${i}`, this.scene);
                    mat.diffuseColor = new BABYLON.Color3(0.8, 0.2, 0.2);
                    domino.material = mat;
                    
                    domino.physicsImpostor = new BABYLON.PhysicsImpostor(
                        domino,
                        BABYLON.PhysicsImpostor.BoxImpostor,
                        { mass: 1, restitution: 0.1, friction: 0.8 },
                        this.scene
                    );
                    
                    this.objects.push(domino);
                    domino.metadata = { isBreakable: false };
                }
                
                const pusher = BABYLON.MeshBuilder.CreateSphere("pusher", { diameter: 0.5 }, this.scene);
                pusher.position = new BABYLON.Vector3(-5, 2, 0);
                const pusherMat = new BABYLON.StandardMaterial("pusherMat", this.scene);
                pusherMat.diffuseColor = new BABYLON.Color3(1, 1, 0);
                pusher.material = pusherMat;
                pusher.physicsImpostor = new BABYLON.PhysicsImpostor(
                    pusher,
                    BABYLON.PhysicsImpostor.SphereImpostor,
                    { mass: 2, restitution: 0.5 },
                    this.scene
                );
                this.objects.push(pusher);
                
                this.updateObjectCount();
            },
            
            createNewtonPreset: function() {
                const ballCount = 5;
                const spacing = 0.8;
                const startX = -(ballCount - 1) * spacing / 2;
                
                for (let i = 0; i < ballCount; i++) {
                    const ball = BABYLON.MeshBuilder.CreateSphere(`newtonBall_${i}`, { diameter: 0.6 }, this.scene);
                    ball.position = new BABYLON.Vector3(startX + i * spacing, 3, 0);
                    
                    const mat = new BABYLON.StandardMaterial(`newtonMat_${i}`, this.scene);
                    mat.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);
                    mat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                    ball.material = mat;
                    
                    ball.physicsImpostor = new BABYLON.PhysicsImpostor(
                        ball,
                        BABYLON.PhysicsImpostor.SphereImpostor,
                        { mass: 1, restitution: 0.95, friction: 0.1 },
                        this.scene
                    );
                    
                    const anchor = new BABYLON.Vector3(startX + i * spacing, 5, 0);
                    const joint = new BABYLON.PhysicsJoint(BABYLON.PhysicsJoint.DistanceJoint, {
                        pivotA: new BABYLON.Vector3(0, 0, 0),
                        pivotB: anchor,
                        maxDistance: 2
                    });
                    
                    const anchorMesh = BABYLON.MeshBuilder.CreateSphere(`anchor_${i}`, { diameter: 0.1 }, this.scene);
                    anchorMesh.position = anchor;
                    anchorMesh.isVisible = false;
                    
                    this.objects.push(ball);
                    ball.metadata = { isBreakable: false };
                }
                
                setTimeout(() => {
                    if (this.objects[0] && this.objects[0].physicsImpostor) {
                        this.objects[0].physicsImpostor.setLinearVelocity(new BABYLON.Vector3(-3, 0, 0));
                    }
                }, 500);
                
                this.updateObjectCount();
            },
            
            createStackPreset: function() {
                const layers = 6;
                const blocksPerLayer = 3;
                const blockSize = 0.8;
                
                for (let layer = 0; layer < layers; layer++) {
                    for (let i = 0; i < blocksPerLayer; i++) {
                        const block = BABYLON.MeshBuilder.CreateBox(`stackBlock_${layer}_${i}`, { size: blockSize }, this.scene);
                        
                        if (layer % 2 === 0) {
                            block.position = new BABYLON.Vector3(
                                (i - 1) * blockSize,
                                layer * blockSize + blockSize / 2,
                                0
                            );
                        } else {
                            block.rotation.y = Math.PI / 2;
                            block.position = new BABYLON.Vector3(
                                0,
                                layer * blockSize + blockSize / 2,
                                (i - 1) * blockSize
                            );
                        }
                        
                        const mat = new BABYLON.StandardMaterial(`stackMat_${layer}_${i}`, this.scene);
                        mat.diffuseColor = new BABYLON.Color3(0.6, 0.4 + layer * 0.1, 0.2);
                        block.material = mat;
                        
                        block.physicsImpostor = new BABYLON.PhysicsImpostor(
                            block,
                            BABYLON.PhysicsImpostor.BoxImpostor,
                            { mass: 1, restitution: 0.2, friction: 0.8 },
                            this.scene
                        );
                        
                        this.objects.push(block);
                        block.metadata = { isBreakable: true, breakThreshold: 20 };
                    }
                }
                
                this.updateObjectCount();
            },
            
            createRampPreset: function() {
                const ramp = BABYLON.MeshBuilder.CreateBox("ramp", { width: 8, height: 0.3, depth: 4 }, this.scene);
                ramp.position = new BABYLON.Vector3(0, 1.5, 0);
                ramp.rotation.z = -Math.PI / 8;
                
                const rampMat = new BABYLON.StandardMaterial("rampMat", this.scene);
                rampMat.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.5);
                ramp.material = rampMat;
                
                ramp.physicsImpostor = new BABYLON.PhysicsImpostor(
                    ramp,
                    BABYLON.PhysicsImpostor.BoxImpostor,
                    { mass: 0, restitution: 0.3, friction: 0.3 },
                    this.scene
                );
                
                this.selectedShapeType = "sphere";
                this.objectSize = 0.6;
                
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        this.addRandomObject();
                        const ball = this.objects[this.objects.length - 1];
                        ball.position = new BABYLON.Vector3(-3 + Math.random() * 0.5, 4 + i * 0.3, Math.random() * 0.5);
                    }, i * 100);
                }
            },
            
            createTowerPreset: function() {
                const floors = 5;
                const radius = 2;
                const ballsPerFloor = 8;
                
                for (let floor = 0; floor < floors; floor++) {
                    for (let i = 0; i < ballsPerFloor; i++) {
                        const angle = (i / ballsPerFloor) * Math.PI * 2;
                        const ball = BABYLON.MeshBuilder.CreateSphere(`towerBall_${floor}_${i}`, { diameter: 0.5 }, this.scene);
                        ball.position = new BABYLON.Vector3(
                            Math.cos(angle) * radius,
                            floor * 0.8 + 1,
                            Math.sin(angle) * radius
                        );
                        
                        const mat = new BABYLON.StandardMaterial(`towerMat_${floor}_${i}`, this.scene);
                        mat.diffuseColor = this.colors[floor % this.colors.length];
                        ball.material = mat;
                        
                        ball.physicsImpostor = new BABYLON.PhysicsImpostor(
                            ball,
                            BABYLON.PhysicsImpostor.SphereImpostor,
                            { mass: 0.5, restitution: 0.5, friction: 0.5 },
                            this.scene
                        );
                        
                        this.objects.push(ball);
                        ball.metadata = { isBreakable: true, breakThreshold: 10 };
                    }
                }
                
                const topSphere = BABYLON.MeshBuilder.CreateSphere("topSphere", { diameter: 1.5 }, this.scene);
                topSphere.position = new BABYLON.Vector3(0, floors * 0.8 + 1.5, 0);
                const topMat = new BABYLON.StandardMaterial("topMat", this.scene);
                topMat.diffuseColor = new BABYLON.Color3(1, 0.8, 0);
                topMat.emissiveColor = new BABYLON.Color3(0.3, 0.2, 0);
                topSphere.material = topMat;
                topSphere.physicsImpostor = new BABYLON.PhysicsImpostor(
                    topSphere,
                    BABYLON.PhysicsImpostor.SphereImpostor,
                    { mass: 2, restitution: 0.3 },
                    this.scene
                );
                this.objects.push(topSphere);
                
                this.updateObjectCount();
            },
            
            updateDebugVisualization: function() {
                this.objects.forEach(obj => {
                    if (obj.debugLines) {
                        obj.debugLines.dispose();
                        obj.debugLines = null;
                    }
                });
            },
            
            updateVelocityVectors: function() {
                this.objects.forEach(obj => {
                    if (!obj.physicsImpostor) return;
                    
                    if (!obj.velocityLine) {
                        obj.velocityLine = BABYLON.MeshBuilder.CreateLines("velocityLine", {
                            points: [BABYLON.Vector3.Zero(), BABYLON.Vector3.Zero()]
                        }, this.scene);
                        obj.velocityLine.color = new BABYLON.Color3(1, 1, 0);
                    }
                    
                    const velocity = obj.physicsImpostor.getLinearVelocity();
                    const scale = 0.3;
                    const endPoint = obj.position.add(velocity.scale(scale));
                    
                    BABYLON.MeshBuilder.CreateLines("velocityLine", {
                        points: [obj.position, endPoint],
                        instance: obj.velocityLine
                    });
                    
                    obj.velocityLine.isVisible = this.showVelocityVectors;
                });
            },
            
            updateCollisionVisualization: function() {
                this.collisionPoints.forEach(point => point.dispose());
                this.collisionPoints = [];
            },
            
            updateObjectCount: function() {
                document.getElementById('objectCount').textContent = this.objects.length;
            },
            
            updateJointCount: function() {
                document.getElementById('jointCount').textContent = this.joints.length;
            },
            
            startRenderLoop: function() {
                let frameCount = 0;
                let lastTime = performance.now();
                
                engine.runRenderLoop(() => {
                    frameCount++;
                    const currentTime = performance.now();
                    
                    if (currentTime - lastTime >= 1000) {
                        document.getElementById('fps').textContent = frameCount;
                        document.getElementById('physicsTime').textContent = this.lastPhysicsTime.toFixed(2);
                        frameCount = 0;
                        lastTime = currentTime;
                    }
                    
                    this.scene.render();
                });
                
                window.addEventListener('resize', () => {
                    engine.resize();
                });
            }
        };
        
        SandboxSystem.init();
    </script>
</body>
</html>
