<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js 3D Physics Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="info">
        <div>Babylon.js 3D Physics Simulation</div>
        <div>左键旋转 | 右键平移 | 滚轮缩放</div>
        <div>10个球体 + 5个立方体 | 物理碰撞模拟</div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    
    <!-- 物理引擎 - 使用Cannon.js作为替代方案 -->
    <script src="https://cdn.babylonjs.com/cannon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <script>
        // 初始化Babylon.js引擎和场景
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);
        
        // 创建场景
        const createScene = function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.18, 1); // 深蓝色背景 #1a1a2e
            
            // 启用物理引擎
            scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), new BABYLON.CannonJSPlugin());
            
            // 创建相机
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                -Math.PI / 2, // alpha
                Math.PI / 2.5, // beta
                15, // radius
                new BABYLON.Vector3(0, 3, 0), // target
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI / 2;
            camera.wheelPrecision = 50;
            
            // 创建光照系统
            // 半球光 - 模拟天空和地面的漫反射
            const hemisphericLight = new BABYLON.HemisphericLight(
                "hemisphericLight",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemisphericLight.intensity = 0.7;
            
            // 点光源 - 位于场景中心上方，产生阴影
            const pointLight = new BABYLON.PointLight(
                "pointLight",
                new BABYLON.Vector3(0, 10, 0),
                scene
            );
            pointLight.intensity = 0.8;
            pointLight.diffuse = new BABYLON.Color3(1, 1, 0.8);
            
            // 创建地面
            const ground = BABYLON.MeshBuilder.CreateGround(
                "ground",
                { width: 20, height: 20 },
                scene
            );
            ground.position.y = 0;
            
            // 地面材质
            const groundMaterial = new BABYLON.StandardMaterial("groundMaterial", scene);
            groundMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            groundMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            ground.material = groundMaterial;
            
            // 为地面添加物理impostor（静态）
            ground.physicsImpostor = new BABYLON.PhysicsImpostor(
                ground,
                BABYLON.PhysicsImpostor.BoxImpostor,
                { mass: 0, restitution: 0.3 },
                scene
            );
            
            // 生成随机颜色的函数
            const getRandomColor = function() {
                const colors = [
                    new BABYLON.Color3(1, 0, 0), // 红
                    new BABYLON.Color3(0, 1, 0), // 绿
                    new BABYLON.Color3(0, 0, 1), // 蓝
                    new BABYLON.Color3(1, 1, 0), // 黄
                    new BABYLON.Color3(1, 0, 1), // 紫
                    new BABYLON.Color3(0, 1, 1), // 青
                    new BABYLON.Color3(1, 0.5, 0), // 橙
                    new BABYLON.Color3(0.5, 0, 0.5), // 深紫
                    new BABYLON.Color3(0.5, 0.5, 0), // 橄榄
                    new BABYLON.Color3(0, 0.5, 0.5)  // 深青
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            };
            
            // 创建10个随机颜色的球体
            for (let i = 0; i < 10; i++) {
                const sphere = BABYLON.MeshBuilder.CreateSphere(
                    `sphere${i}`,
                    { diameter: 0.8 },
                    scene
                );
                
                // 随机位置（场景上方）
                sphere.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 8, // x: -4 到 4
                    5 + Math.random() * 3,     // y: 5 到 8
                    (Math.random() - 0.5) * 8  // z: -4 到 4
                );
                
                // 球体材质
                const sphereMaterial = new BABYLON.StandardMaterial(`sphereMaterial${i}`, scene);
                sphereMaterial.diffuseColor = getRandomColor();
                sphereMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                sphere.material = sphereMaterial;
                
                // 为球体添加物理impostor
                sphere.physicsImpostor = new BABYLON.PhysicsImpostor(
                    sphere,
                    BABYLON.PhysicsImpostor.SphereImpostor,
                    { mass: 1, restitution: 0.6, friction: 0.5 },
                    scene
                );
            }
            
            // 创建5个随机颜色的立方体
            for (let i = 0; i < 5; i++) {
                const box = BABYLON.MeshBuilder.CreateBox(
                    `box${i}`,
                    { size: 0.8 },
                    scene
                );
                
                // 随机位置（场景上方）
                box.position = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 8, // x: -4 到 4
                    5 + Math.random() * 3,     // y: 5 到 8
                    (Math.random() - 0.5) * 8  // z: -4 到 4
                );
                
                // 随机旋转
                box.rotation = new BABYLON.Vector3(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                
                // 立方体材质
                const boxMaterial = new BABYLON.StandardMaterial(`boxMaterial${i}`, scene);
                boxMaterial.diffuseColor = getRandomColor();
                boxMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                box.material = boxMaterial;
                
                // 为立方体添加物理impostor
                box.physicsImpostor = new BABYLON.PhysicsImpostor(
                    box,
                    BABYLON.PhysicsImpostor.BoxImpostor,
                    { mass: 1.5, restitution: 0.4, friction: 0.6 },
                    scene
                );
            }
            
            return scene;
        };
        
        // 创建场景
        const scene = createScene();
        
        // 渲染循环
        engine.runRenderLoop(function() {
            scene.render();
        });
        
        // 窗口大小调整
        window.addEventListener('resize', function() {
            engine.resize();
        });
    </script>
</body>
</html>
